  // Called by Google GIS after user picks a Google account
  async function handleGoogleCredential(response) {
    try {
      const data = await req('/auth/google-token', { method: 'POST', body: JSON.stringify({ credential: response.credential }) });
      state.save(data.user, data.token);
      if (data.user.email === 'lauracar.apply@gmail.com') { router.go('admin'); return; }
      router.go(data.user.userPath ? 'discover' : 'onboarding');
    } catch (e) {
      toast(e.message || 'Google login failed', 'error');
    }
  }

  function initGoogleButton(containerId) {
    const clientId = window.GOOGLE_CLIENT_ID;
    if (!clientId || !window.google) return;
    window.google.accounts.id.initialize({
      client_id: clientId,
      callback: handleGoogleCredential,
      auto_select: false,
    });
    window.google.accounts.id.renderButton(document.getElementById(containerId), {
      theme: 'outline', size: 'large', shape: 'pill', width: 300, text: 'continue_with',
    });
  }

  const BASE = (window.MATCHED_API_URL || '') + '/api';

  async function req(path, opts = {}) {
    const headers = { 'Content-Type': 'application/json', ...opts.headers };
    if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
    const res = await fetch(BASE + path, { ...opts, headers });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'HTTP ' + res.status);
    return data;
  }

  function toast(msg, type, dur) {

    const el = document.createElement('div');

  function formatDL(ds) {
    const tr = T().deadline;
    if (!ds) return 'Open';
    const d = new Date(ds), now = new Date();
    const diff = Math.ceil((d - now) / 86400000);
    if (diff < 0) return tr.expired;
    if (diff === 0) return tr.today;
    if (diff === 1) return tr.tomorrow;
    if (diff <= 7) return tr.days(diff);
    if (diff <= 30) return tr.weeks(Math.ceil(diff / 7));
    return d.toLocaleDateString(lang.current === 'pt' ? 'pt-BR' : 'en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  const LEVEL_THRESHOLDS = [0, 300, 700, 1300, 2100, 3100, 4300, 5800, 7600, 9800, 12500];
  function levelInfo(xp) {
    let level = 1;
    for (let i = 1; i < LEVEL_THRESHOLDS.length; i++) {
      if (xp >= LEVEL_THRESHOLDS[i]) level = i + 1;
      else break;
    }
    const inLevelStart = LEVEL_THRESHOLDS[level - 1] || 0;
    const nextThreshold = LEVEL_THRESHOLDS[level] || (LEVEL_THRESHOLDS[LEVEL_THRESHOLDS.length - 1] + 1000);
    const inLevel = xp - inLevelStart;
    const needed = nextThreshold - inLevelStart;
    return { level, inLevel, needed, pct: Math.round((inLevel / needed) * 100) };
  }

    const searchEl = document.getElementById('discover-search');

  async function loadDiscoverData() {
    const tr = T().discover;
    if (!state.user?.id) {
      console.error('loadDiscoverData: no user id in state', state.user);
      router.go('login');
      return;
    }
    try {
      const [oppsData, swipeData] = await Promise.all([
        api.getMatchedOpps(state.user.id),
        api.getSwipes(state.user.id)
      ]);
      discoverState.swipedIds = new Set((swipeData.swipes || []).map(s => s.opportunityId));
      discoverState.opps = (oppsData.opportunities || []).map(normalizeOpp).filter(o => !discoverState.swipedIds.has(o.id));

    const { opps, filter, search } = discoverState;

      result = result.filter(o => {
        const haystack = [o.programName, o.organizationName, oppField(o, 'description'), ...(o.tags || [])].join(' ').toLowerCase();
        return haystack.includes(search);
      });
    }
    return result;

  function renderCards() {
    const stack = document.getElementById('cstack');
    if (!stack) return;
    const tr = T().discover;
    const remaining = getFiltered().slice(discoverState.idx);
    if (remaining.length === 0) {
      const isSearching = discoverState.search.length > 0;
      stack.innerHTML = `<div class="empty-state"><div class="empty-icon">${isSearching ? '🔍' : '🎉'}</div><h3>${isSearching ? tr.noResults : tr.empty}</h3><p>${isSearching ? '' : tr.emptySub}</p></div>`;
      return;

      stack.appendChild(buildCard(opp, i === 2 ? 'card-1' : i === 1 ? 'card-2' : 'card-3'));

    setupDrag(stack);

  let dragAbort = null;
  function setupDrag(stack) {
    if (dragAbort) dragAbort.abort();
    dragAbort = new AbortController();
    const sig = { signal: dragAbort.signal };
    const card = stack.querySelector('.card-1');
    if (!card) return;
    let sx = 0, sy = 0, cx = 0, dragging = false;

    function start(e) {
      if (!card.contains(e.target) || e.target.closest('[data-opp-detail]')) return;
      dragging = true; sx = e.touches ? e.touches[0].clientX : e.clientX; sy = e.touches ? e.touches[0].clientY : e.clientY; card.classList.add('dragging');
    }
    function move(e) {
      if (!dragging) return; e.preventDefault();
      cx = (e.touches ? e.touches[0].clientX : e.clientX) - sx;
      const cy = (e.touches ? e.touches[0].clientY : e.clientY) - sy;
      card.style.transform = `translateX(${cx}px) translateY(${cy * 0.1}px) rotate(${cx * 0.08}deg)`;
      const lk = card.querySelector('.swipe-like'), ps = card.querySelector('.swipe-pass');
      if (cx > 60) { lk.style.opacity = Math.min(1, (cx-60)/60); ps.style.opacity = 0; }
      else if (cx < -60) { ps.style.opacity = Math.min(1, (-cx-60)/60); lk.style.opacity = 0; }
      else { lk.style.opacity = 0; ps.style.opacity = 0; }
    }
    function end() {
      if (!dragging) return; dragging = false; card.classList.remove('dragging');
      if (cx > 100) doSwipe('like'); else if (cx < -100) doSwipe('pass');
      else { card.style.transform = ''; card.querySelector('.swipe-like').style.opacity = 0; card.querySelector('.swipe-pass').style.opacity = 0; }
      cx = 0;
    }
    card.addEventListener('mousedown', start, sig);
    card.addEventListener('touchstart', start, { passive: true, signal: dragAbort.signal });
    window.addEventListener('mousemove', move, sig);
    window.addEventListener('touchmove', move, { passive: false, signal: dragAbort.signal });
    window.addEventListener('mouseup', end, sig);
    window.addEventListener('touchend', end, sig);
  }

  async function doSwipe(action) {
    const opp = getFiltered()[discoverState.idx];
    if (!opp) return;
    const stack = document.getElementById('cstack');
    const card = stack && stack.querySelector('.card-1');
    if (card) card.classList.add(action === 'like' ? 'swiped-right' : 'swiped-left');
    try {
      const result = await api.swipe(state.user.id, opp.id, action, opp.matchScore);
      discoverState.swipedIds.add(opp.id);
      if (result && result.xpGained > 0) {
        state.updateUser({ xpTotal: result.xpTotal, level: result.level, currentStreak: result.currentStreak });
        if (result.levelUp) toast(`🎉 Level up! Now Level ${result.level}`, 'success');
        else if (action === 'like') toast(T().xpEarned(result.xpGained), 'success');
      }
    } catch {}
    if (action === 'like') { showMatchOverlay(opp); return; }
    setTimeout(() => { discoverState.idx++; renderCards(); }, 400);
  }

  async function doSave() {
    const opp = getFiltered()[discoverState.idx];
    if (!opp) return;
    try { await api.save(state.user.id, opp.id); toast(T().toasts.savedLater, 'success'); doSwipe('pass'); }
    catch { toast(T().toasts.cantSave, 'error'); }
  }

  async function doQuestCurrent() {
    const opp = getFiltered()[discoverState.idx];
    if (!opp) return;
    await createQuest(opp);
  }

  async function createQuest(opp) {
    try {
      const data = await api.createQuest(state.user.id, opp.id);
      toast(T().toasts.questStarted, 'success');
      if (data.xpGained > 0) {
        state.updateUser({ xpTotal: data.xpTotal, level: data.level });
        if (data.levelUp) toast(`🎉 Level up! Nível ${data.level}`, 'success');
        else toast(T().xpEarned(data.xpGained), 'success');
      }
      discoverState.idx++;
      renderCards();
      syncResult(opp.id, 'applying').catch(() => {});
    }
    catch (e) { toast(e.message || T().toasts.cantQuest, 'error'); }
  }

  async function syncResult(opportunityId, status, extra = {}) {
    const rd = await api.getResults(state.user.id);
    const existing = (rd.results || []).find(r => r.opportunityId === opportunityId);
    if (existing) {
      await api.updateResult(existing.id, { status, ...extra });
    } else {
      await api.upsertResult({ userId: state.user.id, opportunityId, status, ...extra });
    }
  }

  async function pageQuests(el, rt) {
    const tr = T().quests;
    el.innerHTML = `
      <div style="min-height:100dvh;padding-bottom:100px;">
        <div class="page-header" style="padding-bottom:4px;"><h1>${tr.title}</h1><p>${tr.sub}</p></div>
        <div id="ql" class="qpage-wrap"><div class="spinner"></div></div>
      </div>`;
    try {
      const [qd, od] = await Promise.all([api.getQuests(state.user.id), api.getOpps(100)]);
      const quests = (qd.quests || []).filter(q => q.status === 'in-progress');
      const opps = {};
      (od.opportunities || []).map(normalizeOpp).forEach(o => { opps[o.id] = o; });
      const ql = document.getElementById('ql');
      if (quests.length === 0) {
        ql.innerHTML = `<div class="empty-state"><div class="empty-icon">📋</div><h3>${tr.empty}</h3><p>${tr.emptySub}</p></div>`;
        return;
      }

      const C = 251.3; // SVG ring circumference (2π×40)
      const ST = T().status;
      const labelColors = { 'in-progress': '#2563EB', submitted: '#0B1F4D', accepted: '#059669', rejected: '#DC2626', withdrawn: '#94a3b8' };
      const terminalIcons = { accepted: '🎉', rejected: '😔', withdrawn: '↩️' };

      ql.innerHTML = '';
      quests.forEach(q => {
        const opp = opps[q.opportunityId];
        const tasks = q.tasks || [];
        const done = tasks.filter(t => t.isCompleted).length;
        const total = tasks.length;
        const pct = q.progressPercentage || 0;
        const dashOffset = C * (1 - pct / 100);
        const isTerminal = ['accepted', 'rejected', 'withdrawn'].includes(q.status);
        const labelColor = labelColors[q.status] || '#2563EB';

        // Deadline badge
        let deadlineHtml = '';
        if (opp && opp.deadline) {
          const daysLeft = Math.ceil((new Date(opp.deadline) - new Date()) / 86400000);
          if (daysLeft > 0) {
            const isUrgent = daysLeft <= 14;
            const dl = T().deadline;
            const label = daysLeft === 1 ? dl.tomorrow : daysLeft <= 7 ? dl.days(daysLeft) : dl.weeks(Math.ceil(daysLeft / 7));
            deadlineHtml = `<div class="qc-deadline${isUrgent ? '' : ' ok'}">⏰ ${label}</div>`;
          } else if (opp.deadline) {
            deadlineHtml = `<div class="qc-deadline">⏰ ${T().deadline.expired}</div>`;
          }
        }

        // Tags (first 2)
        const tags = opp && opp.tags ? opp.tags.slice(0, 2) : [];
        const tagsHtml = tags.map((t, i) => `<span class="qc-tag-${i === 0 ? 'dark' : 'green'}">${t}</span>`).join('');

        // Tasks HTML
        const checkSvg = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0B1F4D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
        const tasksHtml = tasks.map((t, i) => {
          const isDim = !t.isCompleted && i > done + 1;
          return `
            <div class="qc-task ${t.isCompleted ? 'completed' : isDim ? 'pending-dim' : ''}" data-qid="${q.id}" data-tid="${t.id}">
              <div class="qc-task-check">${t.isCompleted ? checkSvg : ''}</div>
              <div class="qc-task-info"><div class="qc-task-title">${translateTask(t.title)}</div></div>
            </div>`;
        }).join('');

        // Action footer — only in-progress quests shown, always show submit/withdraw
        const actionHtml = `
          <div class="qc-cta-wrap">
            <button class="qc-cta-btn qs-submit" data-qid="${q.id}">${tr.submit} →</button>
            <p class="qc-cta-note">${tr.ctaNote}</p>
            <div style="display:flex;justify-content:center;">
              <button class="qc-status-btn qc-status-btn-withdraw qs-withdraw" data-qid="${q.id}">${tr.withdraw}</button>
            </div>
          </div>`;

        const section = document.createElement('div');
        section.className = 'qc-section';
        section.dataset.qid = q.id;
        section.innerHTML = `
          <span class="qc-label" style="color:${labelColor};">${q.status === 'in-progress' ? tr.ongoingLabel : (ST[q.status] || '')}</span>
          <h1 class="qc-heading">${typeof tr.questHeading === 'function' ? tr.questHeading(opp ? opp.programName : '—') : tr.title}</h1>

          <div class="qc-bento">
            <div style="flex:1;min-width:0;">
              ${deadlineHtml}
              <p class="qc-prog-name">${opp ? opp.programName : '—'}</p>
              <div class="qc-tags">${tagsHtml}</div>
            </div>
            <div class="qc-ring-wrap">
              <svg viewBox="0 0 96 96" width="88" height="88">
                <circle cx="48" cy="48" r="40" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="6"/>
                <circle class="progress-ring-circle" cx="48" cy="48" r="40" fill="none"
                  stroke="#A3E635" stroke-width="8" stroke-linecap="round"
                  stroke-dasharray="${C}" stroke-dashoffset="${dashOffset.toFixed(1)}"/>
              </svg>
              <div class="qc-ring-label">
                <span class="qc-ring-pct" id="qrp-${q.id}">${pct}%</span>
                <span class="qc-ring-sub">${tr.readiness}</span>
              </div>
            </div>
          </div>

          <div class="qc-tasks-header">
            <h2>${tr.tasks}</h2>
            <span id="qtcount-${q.id}">${tr.ofComplete(done, total)}</span>
          </div>
          <div class="qc-tasks-list" id="qtl-${q.id}">${tasksHtml}</div>
          ${actionHtml}`;

        ql.appendChild(section);
      });

      // Task click handlers
      ql.querySelectorAll('.qc-task:not(.completed)').forEach(item => {
        item.onclick = async () => {
          const qid = item.dataset.qid, tid = item.dataset.tid;
          item.style.opacity = '0.5';
          try {
            const upd = await api.completeTask(qid, tid);
            item.classList.add('completed');
            item.classList.remove('pending-dim');
            const checkSvg2 = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0B1F4D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
            item.querySelector('.qc-task-check').innerHTML = checkSvg2;
            item.style.opacity = '';
            item.onclick = null;

            // Update ring + counter
            const newPct = upd.progressPercentage;
            const newOffset = (C * (1 - newPct / 100)).toFixed(1);
            const sec = item.closest('.qc-section');
            if (sec) {
              const ring = sec.querySelector('.progress-ring-circle');
              if (ring) ring.setAttribute('stroke-dashoffset', newOffset);
              const pctEl = document.getElementById(`qrp-${qid}`);
              if (pctEl) pctEl.textContent = `${newPct}%`;
              const newDone = upd.tasks.filter(t => t.isCompleted).length;
              const counter = document.getElementById(`qtcount-${qid}`);
              if (counter) counter.textContent = tr.ofComplete(newDone, upd.tasks.length);
            }
          } catch (e) { item.style.opacity = ''; toast(e.message, 'error'); }
        };
      });

      ql.querySelectorAll('.qs-submit').forEach(b => {
        b.onclick = async () => {
          try {
            b.disabled = true;
            const submitData = await api.setQuestStatus(b.dataset.qid, 'submitted');
            const quest = quests.find(q => q.id === b.dataset.qid);
            if (quest) syncResult(quest.opportunityId, 'waiting').catch(() => {});
            if (submitData && submitData.xpTotal) {
              state.updateUser({ xpTotal: submitData.xpTotal, level: submitData.level });
              if (submitData.levelUp) toast(`🎉 Level up! Nível ${submitData.level}`, 'success');
            }
            toast(lang.current === 'en' ? `Application submitted! +70 XP` : `Aplicação enviada! +70 XP`, 'success', 4000);
            rt.go('results');
          } catch(e) { b.disabled = false; toast(e.message || 'Erro', 'error'); }
        };
      });
      ql.querySelectorAll('.qs-withdraw').forEach(b => {
        b.onclick = async () => {
          await api.setQuestStatus(b.dataset.qid, 'withdrawn');
          pageQuests(el, rt);
        };
      });

    } catch (e) {
      document.getElementById('ql').innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><h3>Error</h3><p>${e.message}</p></div>`;
    }
  }

    const isEn = lang.current === 'en';
    const modal = document.createElement('div');
    modal.style.cssText = 'position:fixed;inset:0;z-index:600;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);';
    modal.innerHTML = `
      <div style="background:#0e2155;border:1px solid rgba(163,230,53,0.25);border-radius:20px;padding:28px 24px;width:100%;max-width:360px;box-shadow:0 24px 64px rgba(0,0,0,0.6);">
        <div style="font-size:36px;text-align:center;margin-bottom:16px;">🎉</div>
        <h3 style="color:#F1F5F9;font-size:18px;font-weight:800;text-align:center;margin-bottom:8px;">${isEn ? 'Congratulations! 🏆' : 'Parabéns! 🏆'}</h3>
        <p style="color:#94a3b8;font-size:14px;text-align:center;margin-bottom:24px;line-height:1.55;">${isEn ? 'Did you receive a scholarship or financial aid?' : 'Você recebeu bolsa de estudos ou auxílio financeiro?'}</p>
        <div style="display:flex;flex-direction:column;gap:10px;">
          <button id="sch-yes" style="background:#A3E635;color:#0B1A3E;border:none;border-radius:12px;font-size:15px;font-weight:700;padding:14px;cursor:pointer;">${isEn ? 'Yes, I received a scholarship' : 'Sim, recebi bolsa'}</button>
          <button id="sch-no" style="background:rgba(255,255,255,0.07);color:#F1F5F9;border:1px solid rgba(255,255,255,0.12);border-radius:12px;font-size:15px;font-weight:600;padding:14px;cursor:pointer;">${isEn ? 'No, no scholarship' : 'Não, sem bolsa'}</button>
        </div>
        <div id="sch-amount-wrap" style="display:none;margin-top:16px;">
          <p style="color:#94a3b8;font-size:13px;margin-bottom:8px;">${isEn ? 'How much? (R$)' : 'Qual o valor? (R$)'}</p>
          <div style="display:flex;gap:8px;">
            <input id="sch-amount" type="number" min="0" placeholder="${isEn ? 'e.g. 50000' : 'ex: 50000'}" style="flex:1;padding:11px 14px;border-radius:10px;border:1.5px solid rgba(163,230,53,0.3);background:rgba(255,255,255,0.06);color:#fff;font-size:14px;font-family:inherit;outline:none;" />
            <button id="sch-save" style="background:#A3E635;color:#0B1A3E;border:none;border-radius:10px;font-size:14px;font-weight:700;padding:11px 18px;cursor:pointer;">${isEn ? 'Save' : 'Salvar'}</button>
          </div>
        </div>
      </div>`;
    document.body.appendChild(modal);

    modal.querySelector('#sch-yes').onclick = () => {
      modal.querySelector('#sch-amount-wrap').style.display = 'block';
      modal.querySelector('#sch-yes').style.display = 'none';
      modal.querySelector('#sch-no').style.display = 'none';
      setTimeout(() => modal.querySelector('#sch-amount').focus(), 50);
    };
    modal.querySelector('#sch-no').onclick = () => { modal.remove(); callback(null); };
    modal.querySelector('#sch-save').onclick = () => {
      const amount = Number(modal.querySelector('#sch-amount').value) || null;
      modal.remove();
      callback(amount);
    };
    // Close on backdrop click
    modal.onclick = (e) => { if (e.target === modal) { modal.remove(); callback(null); } };
  }

  async function pageResults(el, rt) {
    const tr = T().results;
    el.innerHTML = `
      <div style="min-height:100dvh;padding-bottom:90px;">
        <div class="page-header"><h1>${tr.title}</h1><p>${tr.sub}</p></div>
        <div id="res-summary" style="padding:0 20px 12px;"></div>
        <div id="res-filters" style="padding:0 20px 12px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;"></div>
        <div id="res-list" style="padding:0 20px;"><div class="spinner"></div></div>
      </div>`;

    let allSaved = [], allOpps = {}, allResults = {}, activeFilter = 'all';

    async function load() {
      const [sv, od, rd] = await Promise.all([
        api.getSaved(state.user.id),
        api.getOpps(500),
        api.getResults(state.user.id),
      ]);
      allSaved = (sv.savedOpportunities || []).filter(s => s.status !== 'removed');
      (od.opportunities || []).map(normalizeOpp).forEach(o => { allOpps[o.id] = o; });
      (rd.results || []).forEach(r => { allResults[r.opportunityId] = r; });
    }

    function renderSummary() {
      const accepted = Object.values(allResults).filter(r => r.status === 'accepted');
      const totalBRL = accepted.reduce((s, r) => s + (Number(r.scholarshipAmountBRL) || 0), 0);
      const withDecision = Object.values(allResults).filter(r => r.status === 'accepted' || r.status === 'rejected').length;
      const rate = withDecision > 0 ? Math.round(accepted.length / withDecision * 100) : null;
      const el = document.getElementById('res-summary');
      if (!el) return;
      if (accepted.length === 0 && !totalBRL) { el.innerHTML = ''; return; }
      el.innerHTML = `<div style="background:rgba(163,230,53,0.08);border:1px solid rgba(163,230,53,0.2);border-radius:14px;padding:12px 16px;font-size:13px;color:rgba(255,255,255,0.7);">
        🏆 ${tr.summary(accepted.length, totalBRL || null, rate)}
      </div>`;
    }

    function getDisplayIds() {
      const ids = new Set(allSaved.map(s => s.opportunityId));
      Object.keys(allResults).forEach(id => {
        if (allResults[id].status && allResults[id].status !== 'not_started') ids.add(id);
      });
      return [...ids].filter(id => allOpps[id]);
    }

    function renderFilters() {
      const el = document.getElementById('res-filters');
      if (!el) return;
      const displayIds = getDisplayIds();
      const counts = { all: displayIds.length };
      displayIds.forEach(id => {
        const st = allResults[id]?.status || 'not_started';
        counts[st] = (counts[st] || 0) + 1;
      });
      const filters = [{ key: 'all', label: tr.filterAll }, ...Object.entries(tr.statuses).map(([k, v]) => ({ key: k, label: v }))];
      el.innerHTML = filters.map(f => {
        const isActive = f.key === activeFilter;
        const c = counts[f.key] || 0;
        const color = f.key === 'all' ? '#fff' : tr.statusColors[f.key];
        return `<button class="res-filter-btn" data-filter="${f.key}" style="white-space:nowrap;padding:6px 14px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid ${isActive?(f.key==='all'?'rgba(255,255,255,0.4)':color):'rgba(255,255,255,0.1)'};background:${isActive?(f.key==='all'?'rgba(255,255,255,0.1)':'rgba(163,230,53,0.07)'):'transparent'};color:${isActive?color:'rgba(255,255,255,0.4)'};">
          ${f.label}${c > 0 ? ` <span style="opacity:0.6;font-weight:400;">(${c})</span>` : ''}
        </button>`;
      }).join('');
      el.querySelectorAll('.res-filter-btn').forEach(btn => {
        btn.onclick = () => { activeFilter = btn.dataset.filter; renderFilters(); renderList(); };
      });
    }

    function renderList() {
      const list = document.getElementById('res-list');
      if (!list) return;
      const displayIds = getDisplayIds();
      const filtered = displayIds.filter(id => {
        if (activeFilter === 'all') return true;
        const st = allResults[id]?.status || 'not_started';
        return st === activeFilter;
      });
      if (displayIds.length === 0) {
        list.innerHTML = `<div class="empty-state"><div class="empty-icon">📊</div><h3>${tr.empty}</h3><p>${tr.emptySub}</p></div>`;
        return;
      }
      if (filtered.length === 0) {
        list.innerHTML = `<div style="text-align:center;color:rgba(255,255,255,0.35);padding:48px 0;font-size:14px;">${tr.noMatch}</div>`;
        return;
      }
      list.innerHTML = filtered.map(id => {
        const opp = allOpps[id];
        if (!opp) return '';
        const result = allResults[id];
        const status = result?.status || 'not_started';
        const color = tr.statusColors[status] || 'rgba(255,255,255,0.3)';
        const label = tr.statuses[status];
        const brl = result?.scholarshipAmountBRL;
        const fmtDate = dt => dt ? new Date(dt).toLocaleDateString(lang.current === 'pt' ? 'pt-BR' : 'en-US', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
        return `<div style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-radius:16px;padding:16px;margin-bottom:12px;" data-opp-id="${id}">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px;">
            <div style="flex:1;min-width:0;">
              <div style="font-size:14px;font-weight:700;color:#fff;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${opp.programName || '—'}</div>
              <div style="font-size:12px;color:rgba(255,255,255,0.4);">${opp.organizationName || ''}</div>
            </div>
            <span class="res-status-badge" data-opp-id="${id}" style="padding:4px 12px;border-radius:999px;font-size:11px;font-weight:700;background:${color}20;color:${color};border:1px solid ${color}40;cursor:pointer;white-space:nowrap;flex-shrink:0;">${label}</span>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;">
            ${opp.category ? `<span style="background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.5);font-size:11px;padding:2px 8px;border-radius:6px;">${opp.category}</span>` : ''}
            ${opp.deadline ? `<span style="background:rgba(245,158,11,0.1);color:#fbbf24;font-size:11px;padding:2px 8px;border-radius:6px;">📅 ${new Date(opp.deadline).toLocaleDateString(lang.current==='pt'?'pt-BR':'en-US',{month:'short',day:'numeric'})}</span>` : ''}
          </div>
          ${result?.appliedAt ? `<div style="font-size:11px;color:rgba(255,255,255,0.3);margin-bottom:2px;">${tr.appliedDate} ${fmtDate(result.appliedAt)}</div>` : ''}
          ${result?.decisionAt ? `<div style="font-size:11px;color:rgba(255,255,255,0.3);margin-bottom:2px;">${tr.decisionDate} ${fmtDate(result.decisionAt)}</div>` : ''}
          ${status === 'accepted' && brl ? `<div style="font-size:13px;color:#A3E635;font-weight:700;margin-top:4px;">💰 ${tr.scholarshipLabel} R$ ${Number(brl).toLocaleString('pt-BR')}</div>` : ''}
          <div class="res-status-picker" data-opp-id="${id}" style="display:none;margin-top:12px;">
            <div style="font-size:11px;color:rgba(255,255,255,0.4);margin-bottom:8px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;">Atualizar status</div>
            <div style="display:flex;gap:6px;flex-wrap:wrap;">
              ${Object.entries(tr.statuses).map(([k, v]) => `
                <button class="res-status-btn" data-opp-id="${id}" data-status="${k}" style="padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid ${k===status?tr.statusColors[k]:'rgba(255,255,255,0.12)'};background:${k===status?tr.statusColors[k]+'22':'transparent'};color:${k===status?tr.statusColors[k]:'rgba(255,255,255,0.5)'};">${v}</button>
              `).join('')}
            </div>
            <div id="res-brl-field-${id}" style="display:${status==='accepted'?'flex':'none'};margin-top:10px;gap:8px;align-items:center;">
              <input id="res-brl-${id}" type="number" min="0" placeholder="${tr.scholarshipPh}" value="${brl || ''}" style="flex:1;padding:8px 12px;border-radius:8px;border:1.5px solid rgba(163,230,53,0.3);background:rgba(255,255,255,0.06);color:#fff;font-size:13px;font-family:inherit;outline:none;" />
              <button class="res-save-brl" data-opp-id="${id}" style="background:#A3E635;color:#0B1F4D;border:none;border-radius:8px;font-size:13px;font-weight:700;padding:8px 14px;cursor:pointer;">Salvar</button>
            </div>
          </div>
        </div>`;
      }).join('');

      // Status badge toggles the picker
      list.querySelectorAll('.res-status-badge').forEach(badge => {
        badge.onclick = () => {
          const picker = list.querySelector(`.res-status-picker[data-opp-id="${badge.dataset.oppId}"]`);
          if (picker) picker.style.display = picker.style.display === 'none' ? 'block' : 'none';
        };
      });

      // Status buttons
      list.querySelectorAll('.res-status-btn').forEach(btn => {
        btn.onclick = async () => {
          const oppId = btn.dataset.oppId;
          const newStatus = btn.dataset.status;
          const existing = allResults[oppId];

          const payload = { userId: state.user.id, opportunityId: oppId, status: newStatus };
          const updated = existing
            ? await api.updateResult(existing.id, { status: newStatus })
            : await api.upsertResult(payload);
          allResults[oppId] = updated;

          if (newStatus === 'accepted') {
            if (updated.xpGained > 0) {
              state.updateUser({ xpTotal: updated.xpTotal, level: updated.level });
              if (updated.levelUp) toast(`🎉 Level up! Nível ${updated.level}`, 'success');
              else toast(`+${updated.xpGained} XP — Parabéns!`, 'success');
            }
            showScholarshipPopup(oppId, async (amountBRL) => {
              if (amountBRL !== null) {
                const res = await api.updateResult(allResults[oppId].id, { scholarshipAmountBRL: amountBRL });
                allResults[oppId] = res;
              }
              renderSummary(); renderFilters(); renderList();
            });
          } else {
            renderSummary(); renderFilters(); renderList();
          }
        };
      });

      // BRL save buttons
      list.querySelectorAll('.res-save-brl').forEach(btn => {
        btn.onclick = async () => {
          const oppId = btn.dataset.oppId;
          const input = list.querySelector(`#res-brl-${oppId}`);
          const amount = input ? Number(input.value) || null : null;
          const existing = allResults[oppId];
          if (existing) {
            const updated = await api.updateResult(existing.id, { scholarshipAmountBRL: amount });
            allResults[oppId] = updated;
          }
          renderSummary(); renderFilters(); renderList();
        };
      });
    }

    try {
      await load();
      renderSummary();
      renderFilters();
      renderList();
    } catch (e) {
      document.getElementById('res-list').innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><h3>Erro</h3><p>${e.message}</p></div>`;
    }
  }

  async function pageDeadlines(el, rt) {
    const tr = T().deadlines;
    el.innerHTML = `
      <div style="min-height:100dvh;padding-bottom:100px;">
        <div class="page-header"><h1>${tr.title}</h1><p>${tr.sub}</p></div>
        <div style="padding:0 20px 12px;">
          <button class="dl-notify-btn" id="dl-notify-btn">${tr.notify}</button>
        </div>
        <div id="dl-list" style="padding:0 20px;"><div class="spinner"></div></div>
      </div>`;

    // Notification button state
    updateNotifyBtn();
    document.getElementById('dl-notify-btn').onclick = () => requestDeadlineNotifications();

    try {
      const data = await api.getDeadlines(state.user.id);
      const deadlines = data.deadlines || [];
      const list = document.getElementById('dl-list');

      if (deadlines.length === 0) {
        list.innerHTML = `<div class="empty-state"><div class="empty-icon">📅</div><h3>${tr.empty}</h3><p>${tr.emptySub}</p></div>`;
        return;
      }

      const urgencyOrder = ['critical', 'high', 'medium', 'low', 'expired'];
      const groups = {};
      urgencyOrder.forEach(u => { groups[u] = []; });
      deadlines.forEach(d => { (groups[d.urgency] || groups.low).push(d); });

      const urgencyColors = { critical: '#DC2626', high: '#EA580C', medium: '#CA8A04', low: '#64748b', expired: '#94a3b8' };
      const urgencyBorder = { critical: '#DC2626', high: '#F97316', medium: '#EAB308', low: '#CBD5E1', expired: '#E2E8F0' };

      list.innerHTML = '';
      urgencyOrder.forEach(u => {
        if (groups[u].length === 0) return;
        const section = document.createElement('div');
        section.style.cssText = 'margin-bottom:24px;';
        section.innerHTML = `<div class="dl-section-label" style="color:${urgencyColors[u]};">${tr.sections[u]}</div>`;

        groups[u].forEach(d => {
          const isExpired = d.urgency === 'expired';
          const daysLabel = isExpired ? T().deadline.expired : tr.daysLeft(d.daysLeft);
          const sourceLabel = tr.source[d.source.source] || d.source.source;
          const sourceBg = { quest: '#A3E635', saved: '#EFF6FF', liked: '#FEF2F2' }[d.source.source] || '#F1F5F9';
          const sourceColor = { quest: '#0B1F4D', saved: '#0B1F4D', liked: '#DC2626' }[d.source.source] || '#64748b';
          const deadlineFmt = new Date(d.deadline).toLocaleDateString(lang.current === 'pt' ? 'pt-BR' : 'en-US', { month: 'short', day: 'numeric', year: 'numeric' });
          const hasQuest = d.source.source === 'quest';

          const card = document.createElement('div');
          card.className = 'dl-card';
          card.style.cssText = `border-left: 4px solid ${urgencyBorder[u]};${isExpired ? 'opacity:0.6;' : ''}`;
          card.innerHTML = `
            <div class="dl-card-top">
              <div style="flex:1;min-width:0;">
                <div class="dl-card-name">${d.programName}</div>
                <div class="dl-card-org">${d.organizationName || ''}</div>
              </div>
              <div class="dl-days-badge" style="background:${urgencyColors[u]};">${daysLabel}</div>
            </div>
            <div class="dl-card-meta">
              <span class="dl-source-badge" style="background:${sourceBg};color:${sourceColor};">${sourceLabel}</span>
              <span class="dl-date-label">📅 ${deadlineFmt}</span>
            </div>
            <div class="dl-card-actions">
              ${hasQuest
                ? `<button class="dl-btn-quest" data-qpage="true">📋 ${tr.viewQuest}</button>`
                : (d.websiteUrl ? `<a class="dl-btn-apply" href="${d.websiteUrl}" target="_blank" rel="noopener">${tr.apply}</a>` : '')
              }
            </div>`;

          if (hasQuest) {
            card.querySelector('.dl-btn-quest').onclick = () => rt.go('quests');
          }
          section.appendChild(card);
        });

        list.appendChild(section);
      });
    } catch (e) {
      document.getElementById('dl-list').innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><h3>Error</h3><p>${e.message}</p></div>`;

  function updateNotifyBtn() {
    const btn = document.getElementById('dl-notify-btn');
    if (!btn) return;
    const tr = T().deadlines;
    if (!('Notification' in window)) { btn.style.display = 'none'; return; }
    if (Notification.permission === 'granted') {
      btn.textContent = tr.notifyOn;
      btn.classList.add('active');
    } else if (Notification.permission === 'denied') {
      btn.textContent = tr.notifyDenied;
      btn.disabled = true;
      btn.style.opacity = '0.55';
    } else {
      btn.textContent = tr.notify;
      btn.classList.remove('active');
    }
  }

  async function requestDeadlineNotifications() {
    if (!('Notification' in window)) return;
    if (Notification.permission === 'denied') { toast(T().deadlines.notifyDenied, 'error'); return; }
    const perm = await Notification.requestPermission();
    if (perm === 'granted') {
      toast(T().deadlines.notifyGranted, 'success');
      updateNotifyBtn();
      fireDeadlineNotifications();
    } else {
      updateNotifyBtn();
    }
  }

  async function fireDeadlineNotifications() {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    try {
      const data = await api.getDeadlines(state.user.id);
      const urgent = (data.deadlines || []).filter(d => d.daysLeft >= 0 && d.daysLeft <= 3);
      const notifiedKey = 'matched_notified_' + new Date().toDateString();
      const already = new Set(JSON.parse(localStorage.getItem(notifiedKey) || '[]'));
      const tr = T().deadlines;
      urgent.forEach(d => {
        if (already.has(d.opportunityId)) return;
        new Notification(tr.notifyTitle, {
          body: tr.notifyBody(d.programName, d.daysLeft),
          icon: '/favicon.ico',
          tag: 'deadline-' + d.opportunityId,
        });
        already.add(d.opportunityId);
      });
      localStorage.setItem(notifiedKey, JSON.stringify([...already]));
      updateDeadlineBadge(urgent.length);
    } catch {}
  }

  function updateDeadlineBadge(count) {
    const badge = document.getElementById('dl-badge');
    if (!badge) return;
    if (count > 0) {
      badge.textContent = count > 9 ? '9+' : count;
      badge.classList.remove('hidden');
    } else {
      badge.classList.add('hidden');
    }
  }

                <span style="padding:2px 10px;border-radius:999px;font-size:10px;background:${l.status==='success'?'rgba(163,230,53,0.12)':'rgba(220,38,38,0.12)'};color:${l.status==='success'?'#A3E635':'#fca5a5'};">${l.status}</span>
              </div>`).join('')}

        // Import recurring sources button
        c.querySelector('#src-import-recurring-btn').onclick = async () => {
          const btn = c.querySelector('#src-import-recurring-btn');
          const res = c.querySelector('#src-action-result');
          btn.disabled = true; btn.textContent = 'Importando…';
          try {
            const r = await api.importRecurringSources();
            res.style.color = '#A3E635';
            res.textContent = `${r.added} fontes adicionadas, ${r.updated} atualizadas (total: ${r.total})`;
            toast(`${r.added} fontes adicionadas, ${r.updated} atualizadas`, 'success');
            setTimeout(() => renderSources(), 1000);
          } catch (e) {
            res.style.color = '#fca5a5'; res.textContent = 'Erro: ' + e.message;
          } finally { btn.disabled = false; btn.textContent = 'Importar Lista de Fontes'; }
        };

        // Run full capture button
        c.querySelector('#src-run-capture-btn').onclick = async () => {
          const btn = c.querySelector('#src-run-capture-btn');
          const res = c.querySelector('#src-action-result');
          btn.disabled = true; btn.textContent = 'Iniciando…';
          try {
            await api.runCapture();
            res.style.color = '#A3E635';
            res.textContent = 'Captação iniciada em background. Os resultados aparecerão em "Capturadas".';
            toast('Captação iniciada', 'success');
          } catch (e) {
            res.style.color = '#fca5a5'; res.textContent = 'Erro: ' + e.message;
          } finally { btn.disabled = false; btn.textContent = 'Rodar Captação Agora'; }
        };

        // Per-source test buttons
        c.querySelectorAll('.src-check-btn').forEach(btn => {
          btn.onclick = async () => {
            const orig = btn.textContent;
            btn.disabled = true; btn.textContent = '…';
            try {
              const r = await api.captureSource(btn.dataset.id);
              toast(`${r.captured} capturadas, ${r.duplicates} duplicatas`, 'success', 5000);
              setTimeout(() => renderSources(), 800);
            } catch (e) {
              toast('Erro: ' + e.message, 'error', 5000);
            } finally { btn.disabled = false; btn.textContent = orig; }
          };
        });

        // Toggle active/pause buttons
        c.querySelectorAll('.src-toggle-btn').forEach(btn => {
          btn.onclick = async () => {
            const isActive = btn.dataset.active === 'true';
            await api.updateSource(btn.dataset.id, { active: !isActive });
            toast(isActive ? 'Fonte pausada' : 'Fonte ativada', 'info');
            renderSources();
          };
        });

        // Delete buttons
        c.querySelectorAll('.src-del-btn').forEach(btn => {
          btn.onclick = async () => {
            if (!confirm('Remover esta fonte?')) return;
            await api.deleteSource(btn.dataset.id);
            toast('Fonte removida', 'info'); renderSources();
          };
        });

      } catch (e) { c.innerHTML = `<div style="color:#fca5a5;padding:40px;text-align:center;">${e.message}</div>`; }
    }

          const isGreen = ['add', 'import'].includes(t.dataset.tab);
          const isBlue = t.dataset.tab === 'metrics';
          t.style.background = isActive ? 'rgba(255,255,255,0.12)' : (isGreen ? 'rgba(163,230,53,0.07)' : (isBlue ? 'rgba(96,165,250,0.07)' : 'rgba(255,255,255,0.04)'));

          t.style.borderColor = isActive ? 'rgba(255,255,255,0.25)' : (isGreen ? 'rgba(163,230,53,0.3)' : (isBlue ? 'rgba(96,165,250,0.3)' : 'rgba(255,255,255,0.12)'));
        });
        if (activeTab === 'pending') renderPending();
        else if (activeTab === 'live') renderLive();
        else if (activeTab === 'captured') renderCaptured();
        else if (activeTab === 'sources') renderSources();
        else if (activeTab === 'import') renderImport();
        else if (activeTab === 'metrics') renderMetrics();
        else renderAdd();
      };
    });

    await loadData();
    renderPending();
  }

  async function pageProfile(el, rt) {
    const tr = T().profile;
    el.innerHTML = `<div class="profile-page"><div id="pc"><div class="spinner" style="margin-top:80px;"></div></div></div>`;
    try {
      const [ud, bd, pd] = await Promise.all([api.getUser(state.user.id), api.getBadges(state.user.id), api.getProfile(state.user.id)]);
      state.updateUser(ud);
      const u = ud, badges = bd.badges || [], profile = pd.profile || {};
      const { level, inLevel, needed, pct } = levelInfo(u.xpTotal||0);
      const first = u.name.split(' ')[0];
      const planName = u.planType || 'explorer';
      const pathLabel = T().pathLabel[u.userPath] || T().pathLabel['null'];
      const isHS = u.userPath === 'high-school';

      const badgesHtml = badges.length > 0
        ? badges.map(b => `
          <div class="badge-item ${b.isLocked?'locked':''} rarity-${b.rarity}">
            <span class="badge-emoji">${b.icon||'🏅'}</span>
            <div class="badge-name">${b.name}</div>
            <div class="badge-rarity">${b.rarity}</div>
            ${b.isLocked ? `<div style="font-size:10px;color:#9CA3AF;margin-top:2px;">${b.progress||0}%</div>` : ''}
          </div>`).join('')
        : `<p style="color:var(--text-3);font-size:13px;grid-column:span 3;">—</p>`;

      const inStyle = 'width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;font-family:inherit;background:var(--surface);color:var(--text);outline:none;box-sizing:border-box;';
      const profileFields = isHS ? `
        <div class="form-group"><label style="font-size:13px;font-weight:600;color:var(--text-2);">${tr.name}</label><input id="ep-name" value="${u.name}" style="${inStyle}" /></div>
        <div class="form-group"><label style="font-size:13px;font-weight:600;color:var(--text-2);">${tr.school}</label><input id="ep-school" value="${profile.school||''}" style="${inStyle}" /></div>
        <div class="form-group"><label style="font-size:13px;font-weight:600;color:var(--text-2);">GPA</label><input id="ep-gpa" value="${profile.gpa||''}" style="${inStyle}" /></div>` : `
        <div class="form-group"><label style="font-size:13px;font-weight:600;color:var(--text-2);">${tr.name}</label><input id="ep-name" value="${u.name}" style="${inStyle}" /></div>
        <div class="form-group"><label style="font-size:13px;font-weight:600;color:var(--text-2);">${tr.university}</label><input id="ep-uni" value="${profile.university||''}" style="${inStyle}" /></div>
        <div class="form-group"><label style="font-size:13px;font-weight:600;color:var(--text-2);">${tr.major}</label><input id="ep-major" value="${profile.major||''}" style="${inStyle}" /></div>`;

      document.getElementById('pc').innerHTML = `
        <div class="profile-hero">
          <div class="profile-avatar">${first[0].toUpperCase()}</div>
          <div class="profile-name">${u.name}</div>
          <div class="profile-email">${u.email}</div>
          <div class="profile-badge-pill">${pathLabel}</div>
        </div>
        <div class="stats-row">
          <div class="stat-item"><div class="stat-value">Lv.${level}</div><div class="stat-label">${tr.level}</div></div>
          <div class="stat-item"><div class="stat-value">${u.xpTotal||0}</div><div class="stat-label">${tr.totalXp}</div></div>
          <div class="stat-item"><div class="stat-value">🔥${u.currentStreak||0}</div><div class="stat-label">${tr.streak}</div></div>
        </div>
        <div class="xp-section">
          <div class="xp-header"><h3>${tr.levelProgress} ${level} → ${level+1}</h3><span>${inLevel} / ${needed} XP</span></div>
          <div class="xp-bar"><div class="xp-fill" style="width:${pct}%"></div></div>
        </div>
        <div class="section">
          <div class="section-header"><h3>${tr.badges}</h3><span>${badges.filter(b=>!b.isLocked).length} ${tr.unlocked}</span></div>
          <div class="badges-grid">${badgesHtml}</div>

          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">

            <button class="lang-switch-btn ${lang.current==='es'?'active':''}" data-lang="es">🇪🇸 Español</button>

          <button class="btn btn-ghost" id="chpath">${tr.changePath}</button>
          <button class="btn btn-ghost" id="logout" style="color:var(--danger);border-color:var(--danger);">${tr.signOut}</button>
        </div>`;

      document.getElementById('logout').onclick = async () => { await state.clear(); rt.go('login'); };
      document.getElementById('chpath').onclick = () => rt.go('onboarding');
      const adminBtn = document.getElementById('go-admin');
      if (adminBtn) adminBtn.onclick = () => rt.go('admin');
      document.getElementById('go-submit-opp-prof').onclick = () => rt.go('submit-opp');

      const epForm = document.getElementById('ep-form');
      document.getElementById('ep-toggle').onclick = () => { epForm.style.display = epForm.style.display === 'none' ? 'flex' : 'none'; };
      document.getElementById('ep-cancel').onclick = () => { epForm.style.display = 'none'; };
      document.getElementById('ep-save').onclick = async () => {
        const btn = document.getElementById('ep-save');
        btn.disabled = true; btn.textContent = '...';
        try {
          const name = document.getElementById('ep-name').value.trim();
          if (name) await api.updateUser(state.user.id, { name });
          const profileUpdates = isHS
            ? { school: (document.getElementById('ep-school')||{}).value, gpa: (document.getElementById('ep-gpa')||{}).value }
            : { university: (document.getElementById('ep-uni')||{}).value, major: (document.getElementById('ep-major')||{}).value };
          await api.updateProfile(state.user.id, profileUpdates);
          state.updateUser({ name });
          toast(T().toasts.profileUpdated, 'success');
          pageProfile(el, rt);
        } catch { btn.disabled = false; btn.textContent = tr.saveProfile; toast(T().toasts.cantUpdate, 'error'); }

          lang.set(btn.dataset.lang);
          pageProfile(el, rt);
        };
      });

    } catch (e) {
      document.getElementById('pc').innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><h3>${tr.errLoad}</h3><p>${e.message}</p></div>`;
    }
  }

  // Load public config (Google Client ID etc.) from backend
  fetch((window.MATCHED_API_URL || '') + '/api/auth/config').then(r => r.json()).then(cfg => {
    if (cfg.googleClientId) window.GOOGLE_CLIENT_ID = cfg.googleClientId;
  }).catch(() => {});

  async function initApp() {
    // Check for password reset link: ?code=XXX&email=YYY
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('code') && urlParams.get('email')) {
      localStorage.setItem('matched_reset_email', urlParams.get('email'));
      window.history.replaceState({}, document.title, window.location.pathname);
      router.go('reset-password');
      return;
    }

    // Check for OAuth callback: #oauth?token=XXX or #oauth?error=XXX
    if (window.location.hash.startsWith('#oauth')) {
      const hashParams = new URLSearchParams(window.location.hash.replace('#oauth?', ''));
      window.history.replaceState({}, document.title, window.location.pathname);
      const oauthToken = hashParams.get('token');
      const oauthError = hashParams.get('error');
      if (oauthError) { toast(oauthError, 'error'); router.go('login'); return; }
      if (oauthToken) {
        state.token = oauthToken;
        try {
          const sync = await api.syncUser();
          state.save(sync.user, oauthToken);
          if (sync.user.email === 'lauracar.apply@gmail.com') { router.go('admin'); return; }
          router.go(sync.user.userPath ? 'discover' : 'onboarding');
        } catch { router.go('login'); }
        return;
      }
    }

    // Restore session from localStorage
    const storedUser = localStorage.getItem('matched_user');
    const storedToken = localStorage.getItem('matched_token');
    if (storedUser && storedToken) {
      try {
        state.user = JSON.parse(storedUser);
        state.token = storedToken;
      } catch { state.clear(); }
    }

    if (!state.isLoggedIn()) {
      router.go('landing');
    } else if (state.user.email === 'lauracar.apply@gmail.com') {
      router.go('admin');
    } else if (!state.user.userPath) {
      router.go('onboarding');
    } else {
      // Update streak and XP on every app open
      try {
        const activity = await api.recordActivity(state.user.id);
        if (activity.currentStreak !== undefined) {
          state.updateUser({ currentStreak: activity.currentStreak, xpTotal: activity.xpTotal, level: activity.level });
        }
      } catch {}
      router.go('discover');
      checkDeadlineNotificationsOnLoad();
    }
  }

  initApp().catch(err => {
    console.error('App init error:', err);
    document.getElementById('page-container').innerHTML = `<div style="min-height:100dvh;display:flex;align-items:center;justify-content:center;background:#0B1A3E;color:#fff;flex-direction:column;gap:12px;font-family:Inter,sans-serif;"><div style="font-size:32px;font-weight:900;">Match<span style="color:#A3E635;">ED</span></div><div style="color:rgba(255,255,255,0.5);font-size:14px;">${err.message}</div><button onclick="location.reload()" style="margin-top:16px;background:#A3E635;color:#0B1F4D;border:none;border-radius:10px;font-size:14px;font-weight:700;padding:12px 28px;cursor:pointer;">Recarregar</button></div>`;
  });
  </script>
</body>
</html>
